services:
  postgres:
    image: postgres:16-alpine
    container_name: ifc-bim-viewer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ifc_bim_viewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ifc_bim_viewer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
